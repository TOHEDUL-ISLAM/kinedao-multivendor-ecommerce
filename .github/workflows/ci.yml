name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
          
      - name: Install dependencies
        run: bun install --frozen-lockfile
        
      - name: Format Check
        run: bun run format:check || echo "Format check failed, but continuing for now"
        
      - name: Lint
        run: bun run lint:fix || echo "Linting failed, but continuing for now"
        
      - name: Type Check
        run: bun run check-types
        
      - name: Build
        run: bun run build
